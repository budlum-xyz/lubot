[workspace]
resolver = "2"
members = [
    "crates/grant",
    "crates/read",
    "crates/index",
    "crates/tools",
    "crates/answer",
    "crates/cikarim",
  "crates/cli",
    "crates/doc",
    "crates/sikistir",
    "crates/muhur",
    "crates/usl",
    "crates/esik",
    "crates/izolasyon",
    "crates/kanit",
    "crates/denetim",
    "crates/kuyruk",
    "crates/erisim",
    "crates/takip",
    "crates/olcek",
    "crates/yetenek",
    "crates/mimari",
    "crates/anlama",
    "crates/tomurcuk",
  "crates/egitim",
  "crates/jeton",
  "crates/arayuz",
  "crates/kanaat",
  "crates/sertlestirme",
  "crates/kodlayici",
]

# The panic limit: a reader that panics is a reader that stops answering.
# `unwrap` and `expect` are refused on the production path; tests are exempt
# through `clippy.toml`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE.md"

# Sertlestirme katmani 1: derleyici. panic = "abort" unwind tablolarini
# kaldirir, strip sembolleri siler, lto = "fat" ile codegen-units = 1 fonksiyon
# sinirlarini birbirine karistirir. Maliyeti derleme suresi; kazanci
# strings/nm ile olculur.
[profile.release]
panic = "abort"
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3
