name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build, test and gates
    runs-on: ubuntu-latest
    # Korpus kamu mali veriyle birlikte 81 bin kayda cikti ve olcumler korpusla
    # olcekleniyor (alma olcumu her soru icin ara'yi kosturur). Sure kirpilmadi:
    # olcumu kucultmek yerine kosu suresi kabul edildi, tavan ona gore.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.88.0
          rustc --version

      - name: Formatting is not a matter of taste here
        run: cargo fmt --all -- --check

      - name: Lints are errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: The suite
        run: cargo test --workspace

      # A gate that cannot prove it catches its own violation is decoration.
      - name: Gate self-tests
        run: |
          set -euo pipefail
          for gate in $(python3 gates/check.py --list); do
            python3 gates/check.py "$gate" --self-test
          done

      # Mimari karar (2026-09-26): egitim verisi repoda tutulmaz. Korpus
      # yalniz depo agacindan (kendi eser) kurulur; kamu mali veri dosyasi
      # depodan kaldirildi. Egitim verisi BUD'dan akisla gelecek ve
      # validatorlerden gececek (ayrinti chat.md'de). --kamu-mali-yok
      # bayragi bu kararin acik beyanidir; dosya verilirse insa yine calisir.
      - name: The corpus builds from this repository tree only
        run: |
          set -euo pipefail
          python3 training/corpus_insa.py --kamu-mali-yok

      - name: Repository gates
        run: python3 gates/check.py --all

      - name: The corpus builder runs on this repository
        run: |
          set -euo pipefail
          python3 training/build_corpus.py --repo . --out /tmp/knowledge.jsonl
          python3 training/make_sft.py --corpus /tmp/knowledge.jsonl \
            --curriculum training/curriculum --out /tmp/sft.jsonl
