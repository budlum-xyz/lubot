name: Dependency review

# Runs only on pull requests, because that is the only moment at which a
# dependency *change* exists. A push to a branch has already accepted the
# change; this is the gate that runs before it is accepted.
#
# `fail-on-severity: low` rather than a threshold: this repository has a small
# dependency set on purpose, so any advisory is worth stopping for.

on:
  pull_request:
    branches: [main]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The action needs the dependency graph and, on a private repository,
    # GitHub Advanced Security. Neither is available on every repository this
    # workflow is copied into, and a missing repository *feature* is not a
    # dependency change: it is switched on by setting the repository variable
    # DEPENDENCY_REVIEW=on, and is skipped - visibly - until then.
    if: vars.DEPENDENCY_REVIEW == 'on'
    permissions:
      contents: read
      pull-requests: write  # Posts the review summary on the pull request
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
          # The same licence policy cargo-deny enforces on the workspace, so a
          # crate cannot be admitted through a PR while being refused locally.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0, BUSL-1.1
