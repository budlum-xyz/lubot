name: Security

# The supply-chain checks that run without a human deciding they matter.
#
# Every action here is pinned to a commit, not to a tag: a tag is a name its
# owner can repoint, and the tj-actions and trivy-action compromises were
# exactly that. The pins are checked by the `workflow-actions-are-pinned` gate,
# so a new `uses:` written with `@v4` fails the build instead of shipping.
#
# Scheduled daily and on every push, because advisories are published
# continuously: a repository that was clean yesterday is not assumed to be
# clean today.

on:
  workflow_dispatch:
  push:
    branches: [main, egitim-dongusu]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  advisories:
    name: RustSec advisories (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write  # A failed audit opens an issue, so the finding outlives the run
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      # Installed from source rather than taken as a prebuilt action: a binary
      # fetched by a third-party action is one more supply-chain decision, and
      # this one is a two-minute build on a hosted runner.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      # A warning is a failure here, with one deliberate exception:
      # RUSTSEC-2026-0192 (`ttf-parser` is unmaintained) is the same exemption
      # deny.toml writes down with its reason, and the two files are read
      # together. Any other warning still stops the run.
      - name: Audit the lockfile, warnings are failures too
        run: |
          set -euo pipefail
          cargo audit --deny warnings --ignore RUSTSEC-2026-0192 --json > audit.json || {
            status=$?
            cat audit.json
            exit "$status"
          }

      - name: Keep the report even when the audit passes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cargo-audit-report
          path: audit.json
          retention-days: 30

  policy:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      # Advisories, licences, bans and sources in one policy file. `--locked`
      # so the check reads the committed lockfile and fails if the lockfile
      # would have to be re-resolved to pass.
      - name: Enforce deny.toml
        run: cargo deny --locked check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The release archive is fetched by exact version and its digest is
      # printed, not compared against a value written here by hand: a checksum
      # invented in a file is worse than none, because it looks like a check.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sha256sum gitleaks.tar.gz
          ./gitleaks version

      - name: Scan the whole history, not just the tip
        run: |
          set -euo pipefail
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  workflow-lint:
    name: Workflow hardening (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor==1.30.1

      # Audits the workflows themselves: template injection, credential
      # persistence, unpinned actions, over-broad tokens. The repository's own
      # gate checks the same properties without network access, so this is the
      # second opinion rather than the only one.
      - name: Audit .github/workflows
        run: zizmor --pedantic --format plain .github/workflows

  supply-chain:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The action refuses any ref but the repository default branch, so the job
    # asks the same question the action asks instead of failing the workflow on
    # every push to a working branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write  # Uploads the scorecard as SARIF to the code-scanning tab
      id-token: write  # Keyless OIDC token that signs the published result
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # codeql-bundle
        with:
          sarif_file: scorecard.sarif
