name: CodeQL

# Static analysis on the languages the extractor supports. Rust support is
# public preview and accepts `build-mode: none` only, which means the source is
# read and the binary is not built: nothing here compiles the workspace, so a
# build-script failure cannot hide the analysis.
#
# If the runner reports that Rust is not a supported language, the run fails
# loudly rather than passing on zero databases - a scanner that silently scans
# nothing is worse than no scanner, because it is trusted.

on:
  workflow_dispatch:
  push:
    branches: [main, egitim-dongusu]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write  # Uploads the analysis as SARIF to code scanning
      actions: read  # Reads the workflow run that produced this analysis
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # codeql-bundle
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # codeql-bundle
        with:
          category: "/language:${{ matrix.language }}"
