# Dependency policy, enforced by `cargo deny check` in CI.
#
# Every entry here is a decision, not a default: a licence is allowed because
# this repository's licence permits it, an advisory is ignored only with a
# reason that names what holds the vulnerable version back, and a source is
# allowed only if the crates in it can be reviewed.

[graph]
# The workspace's own path dependencies are not third-party and are not
# decisions about the outside world.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
# cargo-deny 0.20 semasi (bkz. PR #611): `vulnerability`, `unsound`, `notice`
# ve `severity-threshold` anahtarlari **kaldirildi** - bu anahtarlardan biri
# dosyada durursa butun denetim "failed to validate" ile dusuyor ve hicbir sey
# olculmuyor. Yeni semada zafiyet/unsound/notice bildirimleri zaten hata
# uretir; ayarlanabilen tek sey bakimsizlik ve yanked davranisidir.
yanked = "deny"
unmaintained = "workspace"
# Kullanilmayan bir muafiyet de uyaridir: bir gun zincir degisir ve muafiyet
# sessizce kalirsa, kapiyi kapatan sey muafiyetin kendisi olur.
unused-ignored-advisory = "warn"
# Rejected with a reason rather than muted silently. Duplicates are rejected too:
# a crate present twice can mean two different vulnerability profiles both ship.
# RUSTSEC-2026-0192: `ttf-parser` bakimsiz (unmaintained) bildirimi; zafiyet
# degil ve dolayli geliyor (pdf-extract -> lopdf -> ttf-parser). pdf-extract
# PDF alim kapisinin tasiyicisi oldugu icin zincir kaldirilamiyor; upstream
# alternatifi (skrifa) bizim elimizde degil. Gerekcesiyle kayitli.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "bakimsizlik bildirimi, zafiyet degil; zincir pdf-extract -> lopdf -> ttf-parser ve pdf-extract PDF alim kapisinin tasiyicisi" },
]

[licenses]
# The set this project can ship under. Copyleft licences are refused here for
# the same reason `crates/read` refuses unlicensed sources: a dependency whose
# terms are not settled is not admitted.
# Bu deponun kendi crate'leri hicbir yere yayinlanmaz ve lisanslari SPDX
# ifadesiyle degil, depo kokundeki LICENSE dosyasina isaret eden
# `license-file` alaniyla bildirilir. `unlicensed` hatasi tam da bu yuzden
# cikiyordu: cargo-deny ifade arar, dosya yolu bulur. Asagidaki satir "ozel
# (yayinlanmayan) crate'lerin lisans ifadesi aranmaz" demektir; disaridan gelen
# her crate icin kural aynen isler.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Wildcard **surum** yasak; path bagimliligi ise yasak degil. Ayrim onemli:
# `lubot-answer = { path = "../answer" }` bir surum araligi degil, ayni depodaki
# kardes crate'tir ve surumu workspace ile birlikte yasar. Disaridan gelen bir
# crate'in surumsuz istenmesi ise gercekten bir karardir: o yasakli kalir.
wildcards = "deny"
# Crates banned by name, with the reason kept next to the ban.
deny = []
# Sockets to the outside world are not built into this workspace's product
# crates; the ones that exist are named here so a new one is a deliberate act.
# (Empty until a crate actually needs a network client.)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
